<script>
var K='rewardApp1',S,ref=null,sync='local';
function def(){return{name:'小寶貝',pin:'1234',points:0,
tasks:[{id:1,ic:'🧹',n:'整理房間',p:5},{id:2,ic:'🪥',n:'自己刷牙',p:2},{id:3,ic:'📚',n:'完成功課',p:5},{id:4,ic:'🧺',n:'幫忙家事',p:3}],
rewards:[{id:11,ic:'📺',n:'看30分鐘動畫',p:10},{id:12,ic:'🍪',n:'小點心',p:15},{id:13,ic:'🎡',n:'選週末活動',p:30},{id:14,ic:'🧸',n:'新玩具',p:60}],log:[]}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.tasks)S=def();
var mode='kid',tab='award',msg='',pend=null,ask=false;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
if(ref){ref.set(JSON.parse(JSON.stringify(S))).catch(function(){sync='local';render()})}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var ZI={b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
var FM={a:'ㄚ',o:'ㄛ',e:'ㄜ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',i:'ㄧ',ia:'ㄧㄚ',io:'ㄧㄛ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ',ong:'ㄨㄥ',v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ'};
var TM={'1':'','2':'ˊ','3':'ˇ','4':'ˋ'};
function z1(p){var m=/^([a-zü]+)([1-5])?$/.exec(p||'');if(!m)return '';var s=m[1].replace('ü','v'),t=m[2]||'5',i='',f,r;
if(s==='er')f='er';
else if(s[0]==='y'){r=s.slice(1);f=r[0]==='i'?r:r[0]==='u'?'v'+r.slice(1):'i'+r}
else if(s[0]==='w'){r=s.slice(1);f=r[0]==='u'?r:'u'+r}
else{var l=s.slice(0,2);if(l==='zh'||l==='ch'||l==='sh')i=l;else if(ZI[s[0]])i=s[0];f=s.slice(i.length);
if(i&&'jqx'.indexOf(i)>=0&&f[0]==='u')f='v'+f.slice(1);
if(f==='i'&&['zh','ch','sh','r','z','c','s'].indexOf(i)>=0)f=''}
var b=(ZI[i]||'')+(f===''?'':(FM[f]||''));if(!b)return '';
return t==='5'?'˙'+b:b+TM[t]}
function zc(c,r){var n=r[0]==='\u02d9',t='';if(n)r=r.slice(1);else if('\u02ca\u02c7\u02cb'.indexOf(r.slice(-1))>=0){t=r.slice(-1);r=r.slice(0,-1)}return '<span class="zc"><span>'+c+'</span><span class="zp'+(n?' n':'')+'">'+(n?'<i>\u02d9</i>':'')+'<span class="zs">'+r+'</span>'+(t?'<i>'+t+'</i>':'')+'</span></span>'}
function Z(s){s=String(s);if(mode!=='kid'||S.zy===false||!window.pinyinPro)return esc(s);
return s.split(/([\u4e00-\u9fff]+)/).map(function(seg,i){if(i%2===0)return esc(seg);var a;try{a=pinyinPro.pinyin(seg,{toneType:'num',type:'array',v:true})}catch(e){return esc(seg)}
return seg.split('').map(function(c,j){var r=z1(a[j]);return r?zc(c,r):c}).join('')}).join('')}
function lg(t){S.log.unshift({t:t,d:new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});S.log=S.log.slice(0,60)}
function list(k){return k==='t'?S.tasks:S.rewards}
function render(){
var h='<div class="top"><b style="font-size:22px">⭐ '+Z('小星星獎勵樂園')+'</b>';
h+=mode==='kid'?'<button class="l" data-a="parent">🔒 '+Z('家長')+'</button>':'<button class="l" data-a="exit">👧 回小朋友模式</button>';
h+='</div>';
h+=mode==='kid'?'':'<div class="mut">'+(sync==='on'?'☁️ 已同步':'📴 只存在這台裝置（未同步）')+'</div>';if(ask)h+='<div class="card">'+Z('請輸入家長密碼：')+'<div class="row"><input id="pin" type="password" inputmode="numeric" size="8"><button data-a="pinok">'+Z('確定')+'</button><button class="l" data-a="cancel">'+Z('取消')+'</button></div></div>';
if(msg)h+='<div class="msg">'+Z(msg)+'</div>';
h+='<div class="hero"><div>'+Z(S.name+' 的星星')+'</div><div class="n">⭐ '+S.points+'</div></div>';
h+=mode==='kid'?kid():parent();
var A=document.getElementById('app');A.classList.toggle('zy',mode==='kid'&&S.zy!==false);A.innerHTML=h;msg='';}
function kid(){
var h='<h3>🎁 '+Z('想要的獎勵')+'</h3><div class="grid">';
S.rewards.forEach(function(r){var pc=Math.min(100,Math.round(S.points/r.p*100)),ok=S.points>=r.p;
h+='<div class="card" style="text-align:center"><div class="ic">'+esc(r.ic)+'</div><b>'+Z(r.n)+'</b><div class="mut">'+Z('需要')+' ⭐ '+r.p+'</div><div class="bar"><i style="width:'+pc+'%"></i></div>';
h+=ok?'<button class="g" data-a="redeem" data-id="'+r.id+'">'+Z(pend===r.id?'再按一次確認！':'兌換')+'</button>':'<span class="mut">'+Z('還差 ')+(r.p-S.points)+Z(' 顆星星')+'</span>';
h+='</div>'});
h+='</div><h3>💪 '+Z('怎麼賺星星')+'</h3><div class="grid">';
S.tasks.forEach(function(t){h+='<div class="card" style="text-align:center"><span class="ic">'+esc(t.ic)+'</span><br><b>'+Z(t.n)+'</b><div class="mut">+'+t.p+Z(' 顆星星')+'</div></div>'});
return h+'</div>'+logs(8)}
function logs(n){var h='<h3>📒 '+Z('紀錄')+'</h3><div class="card">';if(!S.log.length)h+='<span class="mut">'+Z('還沒有紀錄')+'</span>';
S.log.slice(0,n).forEach(function(l){h+='<div class="row"><span class="mut">'+l.d+'</span> '+Z(l.t)+'</div>'});return h+'</div>'}
function parent(){
var T=[['award','➕ 加點數'],['t','📝 任務設定'],['r','🎁 獎勵設定'],['set','⚙️ 其他']];
var h='<div class="tabs">';T.forEach(function(x){h+='<button class="'+(tab===x[0]?'on':'')+'" data-a="tab" data-id="'+x[0]+'">'+x[1]+'</button>'});h+='</div>';
if(tab==='award'){h+='<div class="grid">';S.tasks.forEach(function(t){h+='<div class="card" style="text-align:center"><span class="ic">'+esc(t.ic)+'</span><br><b>'+esc(t.n)+'</b><br><button data-a="award" data-id="'+t.id+'">完成 +'+t.p+'</button></div>'});
h+='</div><div class="card"><b>手動調整</b><div class="row"><button class="r" data-a="adj" data-id="-1">-1</button><button class="g" data-a="adj" data-id="1">+1</button><button class="g" data-a="adj" data-id="5">+5</button></div></div>'+logs(10)}
else if(tab==='t'||tab==='r'){var k=tab;h+='<div class="card">';
list(k).forEach(function(x){h+='<div class="row"><input size="2" value="'+esc(x.ic)+'" data-f="'+k+'|'+x.id+'|ic"><input size="12" value="'+esc(x.n)+'" data-f="'+k+'|'+x.id+'|n"><input type="number" style="width:80px" value="'+x.p+'" data-f="'+k+'|'+x.id+'|p"> ⭐<button class="r" data-a="del" data-k="'+k+'" data-id="'+x.id+'">刪除</button></div>'});
h+='<button class="g" data-a="add" data-k="'+k+'">＋ 新增'+(k==='t'?'任務':'獎勵')+'</button><div class="mut">修改後會自動儲存。數字＝'+(k==='t'?'完成可得':'兌換需要')+'的星星數。</div></div>'}
else{h+='<div class="card"><div class="row">小朋友名字：<input value="'+esc(S.name)+'" data-f="set|0|name"></div><div class="row">家長密碼：<input value="'+esc(S.pin)+'" data-f="set|0|pin"></div><div class="row">目前星星：<input type="number" style="width:90px" value="'+S.points+'" data-f="set|0|points"></div><div class="row"><label><input type="checkbox" data-f="set|0|zy" '+(S.zy!==false?'checked':'')+'> 小朋友模式顯示注音</label></div><button class="r" data-a="clr">清除紀錄</button></div>'}
return h}
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=+b.dataset.id,k=b.dataset.k;
if(a==='parent'){ask=true}
else if(a==='cancel'){ask=false}
else if(a==='pinok'){if(document.getElementById('pin').value===S.pin){mode='parent';ask=false}else msg='密碼不對喔'}
else if(a==='exit'){mode='kid';tab='award'}
else if(a==='tab'){tab=b.dataset.id}
else if(a==='award'){var t=S.tasks.filter(function(x){return x.id===id})[0];S.points+=t.p;lg(t.n+' +'+t.p);msg='🎉 '+t.n+'，+'+t.p+' 顆星星！'}
else if(a==='adj'){var v=+b.dataset.id;S.points=Math.max(0,S.points+v);lg('手動調整 '+(v>0?'+':'')+v)}
else if(a==='redeem'){var r=S.rewards.filter(function(x){return x.id===id})[0];if(pend===id&&S.points>=r.p){S.points-=r.p;lg('兌換「'+r.n+'」 -'+r.p);msg='🎁 兌換成功：'+r.n;pend=null}else pend=id}
else if(a==='add'){list(k).push({id:Date.now(),ic:k==='t'?'⭐':'🎁',n:'新項目',p:5})}
else if(a==='del'){var L=list(k);L.splice(L.findIndex(function(x){return x.id===id}),1)}
else if(a==='clr'){S.log=[]}
save();render()});
document.addEventListener('change',function(e){var f=e.target.dataset.f;if(!f)return;var p=f.split('|'),v=e.target.value;
if(p[0]==='set'){S[p[2]]=p[2]==='points'?Math.max(0,parseInt(v)||0):p[2]==='zy'?e.target.checked:v}
else{var x=list(p[0]).filter(function(i){return i.id==p[1]})[0];x[p[2]]=p[2]==='p'?Math.max(0,parseInt(v)||0):v}
save()});
render();
(async function(){try{var db=await claude.use('db');if(!db)return;ref=db.doc('state/main');
ref.onSnapshot(function(s){if(s.exists){var d=s.data();if(d&&d.tasks){d.log=d.log||[];d.rewards=d.rewards||[];S=d}}else{ref.set(JSON.parse(JSON.stringify(S)))}
sync='on';var a=document.activeElement;if(!(a&&a.tagName==='INPUT'))render()},function(){sync='local';render()})}catch(e){}})();
</script>
